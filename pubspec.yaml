name: ophir
description: "Personal Finance Management Application"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter


  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  supabase_flutter: ^2.16.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  image_picker: ^1.2.3
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/auth/
    - assets/icons/navigation/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
